name: Drain activity re-checks

# Free alternative to Vercel Cron (which is daily-only on the Hobby plan): a
# GitHub Actions schedule hits the authenticated /cron/rechecks endpoint hourly.
# GitHub may delay scheduled runs under load (fine — the 2/4/8h ladder tolerates
# lag) and disables the schedule after 60 days without pushes (not fine — it
# silently stopped in Aug 2026). The keepalive step re-enables this workflow on
# every run, which resets that 60-day clock.
on:
  schedule:
    - cron: "0 * * * *" # hourly, UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  actions: write # keepalive step re-enables this workflow

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive (reset GitHub's 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable rechecks.yml --repo "$GITHUB_REPOSITORY"
      - name: Hit /cron/rechecks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://roadrunner-iota-nine.vercel.app/cron/rechecks
